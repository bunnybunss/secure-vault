{% extends 'auth.html' %}
{% block title %}Create an account{% endblock %}
{% block auth_form %}
  <h1>Create an account.</h1>
  <form id="signup-form" class="form-stack">
    <label>Email <input name="email" type="email" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="new-password" required></label>
    <button class="primary-button" type="submit">Create account <span aria-hidden="true">→</span></button>
    <p id="signup-msg" class="result" role="status"></p>
  </form>
  <p class="account-link">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
