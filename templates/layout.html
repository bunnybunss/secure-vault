<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#170e1c">
  <title>{% block title %}{% endblock %} · Secure Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</head>
<body>
  {% set workspace = request.endpoint in ('dashboard', 'encrypt_page', 'decrypt_page', 'share_page') %}
  <header class="site-header">
    <div class="shell header-inner">
      <a class="logo" href="{{ url_for('dashboard') }}"><span class="logo-mark" aria-hidden="true">✦</span> Secure Vault</a>
      {% if workspace %}
        <nav aria-label="Workspace">
          <a href="{{ url_for('dashboard') }}"{% if request.endpoint == 'dashboard' %} aria-current="page"{% endif %}>Overview</a>
          <button class="quiet-button" id="logout-btn" type="button">Sign out</button>
        </nav>
      {% endif %}
    </div>
  </header>
  <main class="shell main">{% block content %}{% endblock %}</main>
  <footer class="site-footer shell">
    <span>Secure Vault</span>
    <a href="https://github.com/bunnybunss/secure-vault">Source on GitHub ↗</a>
  </footer>
</body>
</html>
