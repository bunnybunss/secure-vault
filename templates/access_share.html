{% extends 'layout.html' %}
{% block title %}Shared file{% endblock %}
{% block content %}
  <section class="panel standalone">
    <h1>Shared <em>file.</em></h1>
    {% if filename %}<p class="intro">{{ filename }}</p>{% endif %}
    {% if error %}<p class="result" role="alert">{{ error }}</p>{% endif %}
    <form method="post" class="form-stack">
      <label>Share password <input name="password" type="password" required></label>
      <button class="primary-button" type="submit">Download file <span aria-hidden="true">↓</span></button>
    </form>
  </section>
{% endblock %}
